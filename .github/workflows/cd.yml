name: CD

# Deploys QuoteDesk to Azure (task 09b). Runs on every push to main, and manually via
# workflow_dispatch. Two jobs:
#   build-and-push — build the root Dockerfile, push to the PUBLIC GHCR package
#                    ghcr.io/harsh2292/quotedesk-api, tagged :latest and :<sha>.
#   deploy         — point the Container App at the new :<sha> image, then build and upload the
#                    React app to Static Web Apps.
#
# BOOTSTRAP: the very first run must be a manual dispatch with "Run the deploy job" UNCHECKED —
# the Container App and Static Web App don't exist yet, and `az containerapp create` (run by hand
# from the provisioning steps) needs an image already sitting in GHCR. Every run after that is a
# plain push to main with deploy enabled.
#
# The image is pinned to the commit SHA, never :latest, because Container Apps only cuts a new
# revision when the image *reference* changes — repeatedly pushing :latest would deploy nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_app:
        description: "Run the deploy job (uncheck for the first image-only bootstrap run)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write   # push to ghcr.io with the built-in GITHUB_TOKEN — no PAT
  id-token: write   # azure/login via OIDC — no client secret

env:
  # GHCR requires an all-lowercase path; the GitHub owner is "Harsh2292", so this is hardcoded
  # rather than derived from github.repository_owner.
  IMAGE: ghcr.io/harsh2292/quotedesk-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Skipped only on the bootstrap dispatch (deploy_app unchecked). A plain push to main always
    # deploys; inputs.deploy_app is null on a push, so the first clause carries it.
    if: ${{ github.event_name == 'push' || inputs.deploy_app }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # azure/login authenticates the az CLI already installed on the runner, so a plain `az` call
      # works without the azure/cli action. Only the image reference changes — every secret and env
      # var was set once at `az containerapp create` time and is left in place.
      - name: Point Container App at the new image
        run: |
          az containerapp update \
            --name quotedesk-api \
            --resource-group quotedesk-rg \
            --image ${{ env.IMAGE }}:${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/QuoteDesk.Web/package-lock.json

      # Built here, explicitly, rather than letting the SWA action's Oryx build guess — the two
      # VITE_* values are the whole point of a separate production build (docs/SPEC.md §3, task 09a).
      # VITE_API_BASE_URL is the Container App's own https origin; SSE cannot go through an SWA proxy
      # route (it buffers), so the browser calls the Api directly cross-origin.
      - name: Build web
        working-directory: src/QuoteDesk.Web
        run: |
          npm ci
          npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/QuoteDesk.Web/dist
          skip_app_build: true
